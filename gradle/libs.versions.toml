[versions]
# Must match the main repo (../gradle/libs.versions.toml): the included ../ksat-common,
# ../solver/* and ../ksat modules are built with THIS catalog.
kotlin = "2.3.21"
# Android support (so the modules can also target Android when consumed by an Android app).
agp = "9.4.0"
android-compileSdk = "36"
android-minSdk = "24"

[libraries]
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }

[plugins]
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
# AGP 9: KMP modules use the KMP Android library plugin (androidLibrary {} DSL inside kotlin {}).
androidKmpLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
androidApplication = { id = "com.android.application", version.ref = "agp" }
