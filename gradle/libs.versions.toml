[versions]
# Must match the main repo (../gradle/libs.versions.toml): the included ../ksat-common,
# ../solver/* and ../ksat modules are built with THIS catalog.
kotlin = "2.3.21"
# Android support (so the modules can also target Android when consumed by an Android app).
agp = "9.4.0"
android-compileSdk = "36"
android-minSdk = "24"
# Playground (Compose Multiplatform app): versions as in ktoy (~/github/ktoy).
# Compose MP 1.12.1 / lifecycle 2.11.0 require compileSdk 37, so the playground modules build with
# their own compileSdk (and targetSdk); android-compileSdk above stays in sync with the main repo.
android-playgroundCompileSdk = "37"
androidx-activity = "1.13.0"
# CMP-line lifecycle (org.jetbrains.androidx.lifecycle), tied to Compose MP.
androidx-lifecycle = "2.11.0"
composeMultiplatform = "1.12.1"
kotlinx-coroutines = "1.11.0"
kotlinxDatetime = "0.8.0"

[libraries]
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-lifecycle-viewmodelCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinx-coroutines" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinxDatetime" }

[plugins]
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
# AGP 9: KMP modules use the KMP Android library plugin (androidLibrary {} DSL inside kotlin {}).
androidKmpLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
androidApplication = { id = "com.android.application", version.ref = "agp" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
